name: Lumoria
options:
  deploymentTarget:
    iOS: "18.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Lumoria:
    type: application
    platform: iOS
    sources:
      - path: Lumoria
        excludes: [Vendor/AstronomyEngine/astronomy.c]
      # Third-party C, vendored unchanged: build it quietly.
      - path: Lumoria/Vendor/AstronomyEngine/astronomy.c
        compilerFlags: [-w]
      - path: Data/sites.json
        buildPhase: resources
    # Bundle id and team come from these files (Secrets.xcconfig overrides per Mac).
    configFiles:
      Debug: Lumoria/Config/App.xcconfig
      Release: Lumoria/Config/App.xcconfig
    info:
      path: Lumoria/Info.plist
      properties:
        CFBundleDisplayName: Lumoria
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSCameraUsageDescription: Lumoria uses the camera to place the Moon on a surface around you.
        NSLocationWhenInUseUsageDescription: Lumoria uses your location to find the Moon in your sky.
        UIAppFonts: [Archivo-Medium.ttf, Archivo-ExtraBold.ttf, IBMPlexMono-Medium.ttf]
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: Lumoria/Lumoria-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Supabase

  LumoriaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumoriaTests]
    dependencies:
      - target: Lumoria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elmaedesistemas.lumoria.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumoria:
    build:
      targets:
        Lumoria: all
    test:
      targets: [LumoriaTests]
